<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurants</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
    <h1>Find Restaurants</h1>
    <form action="/restaurants" method="get" class="search-form">
        <label for="postcode">Enter Postcode:</label>
        <input type="text" id="postcode" name="postcode" required>
        <br><br>

        <label for="sortType">Sort By:</label>
        <select id="sortType" name="sortType">
            <option value="NO_SORT">No Sort</option>
            <option value="ASCENDING">Rating: Low to High</option>
            <option value="DESCENDING">Rating: High to Low</option>
        </select>
        <br><br>

        <label for="amount">Number of Results:</label>
        <input type="number" id="amount" name="amount" min="1" value="10">
        <br><br>

        <label for="minRating">Minimum Rating:</label>
        <input type="number" id="minRating" name="minRating" min="0" max="5" step="0.1" value="0">
        <br><br>

        <button type="submit">Search</button>
    </form>

    <h2>Restaurants for Postcode: <span th:text="${postcode}"></span></h2>
    <table border="1" th:if="${restaurants != null}" class="restaurant-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Cuisines</th>
            <th>Rating</th>
            <th>Address</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="restaurant : ${restaurants}">
            <td th:text="${restaurant.name}"></td>
            <td th:text="${restaurant.cuisines}"></td>
            <td th:text="${restaurant.rating}"></td>
            <td th:text="${restaurant.address}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
